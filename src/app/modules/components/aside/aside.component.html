<div class="container animate-fade-in">
  <header class="aside__header">
    <img
      [src]="resume.photo"
      alt="Foto de Erik Proença"
      class="aside__header__img"
      loading="lazy"
    />
    <h1 class="aside__title">{{ resume.name }}, {{ resume.age }}</h1>
    <button
      type="button"
      class="aside__download-btn"
      (click)="onDownload()"
    >
      <img src="/assets/img/download.svg" alt="" aria-hidden="true" />
      Baixar Currículo
    </button>
    <div class="hr"></div>
  </header>

  <div class="aside__body">
    <section class="aside__body__personal__info" aria-label="Informações de contato">
      <div class="aside__body__personal__info__item">
        <img
          class="aside__body__personal__info__item__icon"
          src="/assets/icons/address.svg"
          alt=""
          aria-hidden="true"
          loading="lazy"
        />
        <span>Localização:</span>
        <span>{{ resume.location }}</span>
      </div>

      <div class="aside__body__personal__info__item">
        <img
          class="aside__body__personal__info__item__icon"
          src="/assets/icons/whatsapp.svg"
          alt=""
          aria-hidden="true"
          loading="lazy"
        />
        <span>Telefone:</span>
        <a
          [href]="resume.whatsappHref"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Entrar em contato via WhatsApp">
          {{ resume.phone }}
        </a>
      </div>

      <div class="aside__body__personal__info__item">
        <img
          class="aside__body__personal__info__item__icon"
          src="/assets/icons/email.svg"
          alt=""
          aria-hidden="true"
          loading="lazy"
        />
        <span>E-mail:</span>
        <a
          [href]="'mailto:' + resume.email"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Enviar e-mail">
          {{ resume.email }}
        </a>
      </div>

      <div class="aside__body__personal__info__item">
        <img
          class="aside__body__personal__info__item__icon"
          src="/assets/icons/linkedin.svg"
          alt=""
          aria-hidden="true"
          loading="lazy"
        />
        <span>LinkedIn:</span>
        <a
          [href]="resume.linkedinHref"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Visitar perfil no LinkedIn">
          {{ resume.linkedinHandle }}
        </a>
      </div>
    </section>

    <div class="hr"></div>

    <section class="aside__body__summary">
      <h3 class="aside__body__summary__title">
        <img
          src="/assets/icons/goal.svg"
          alt=""
          aria-hidden="true"
          class="aside__body__summary__title__img"
          loading="lazy"
        >
        Resumo sobre mim
      </h3>
      <p class="aside__body__summary__text">{{ resume.summary }}</p>
    </section>

    <div class="hr"></div>

    <section class="aside__body__languages">
      <h3 class="aside__body__languages__title">
        <img
          src="/assets/icons/languages.svg"
          alt=""
          aria-hidden="true"
          class="aside__body__languages__title__img"
          loading="lazy"
        >
        Idiomas
      </h3>
      <div class="aside__body__languages__list">
        <div class="aside__body__languages__list__item" *ngFor="let language of resume.languages">
          <span>{{ language.name }}:</span> {{ language.level }}
        </div>
      </div>
    </section>
  </div>
</div>
